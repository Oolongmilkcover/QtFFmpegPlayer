name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux 构建 + 无桌面单测
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖（Qt6 + FFmpeg + 构建工具）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libavfilter-dev

      # Linux 分支走 pkg-config 找 FFmpeg（见 CMakeLists 的 if(WIN32)/else()）
      - name: 配置
        run: cmake -S Player/QtPlayer -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: 构建（含 GUI 主程序 + 测试目标）
        run: cmake --build build -j"$(nproc)"

      # 测试不创建窗口，CMake 里已把 QT_QPA_PLATFORM=offscreen 设进测试环境
      - name: 单元测试（无桌面）
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

